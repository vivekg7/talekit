[project]
name = "talekit-tts"
version = "0.1.0"
description = "Local text-to-speech for talekit's voices, on MLX (Apple Silicon)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mlx-audio==0.6.1",
  "misaki[en]>=0.9",
  "phonemizer-fork>=3.3",
  "espeakng-loader>=0.2",
  "numpy",
  "spacy>=3.8,<4",
  # misaki reads English with spaCy's small model, and would otherwise fetch it at run time.
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
package = false
